name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'installer.iss'
  workflow_dispatch:

jobs:
  build:
    name: Build SystemCtrl (Windows)
    runs-on: windows-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Portable Version
        run: |
          dotnet publish "src\SystemCtrl.Desktop\SystemCtrl.Desktop.csproj" -c Release -r win-x64 -p:PublishSingleFile=true -o portable_publish
          Copy-Item "portable_publish\SystemCtrl.exe" "SystemCtrl.exe"

      - name: Publish Installer Source
        run: dotnet publish "src\SystemCtrl.Desktop\SystemCtrl.Desktop.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o installer_publish

      - name: Build Installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Delete Old Release and Tag
        run: gh release delete latest-build --cleanup-tag -y
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "latest"
          body: "This is the most recent automated build of SystemCtrl. Choose the Installer for a normal installation, or the standalone Executable for a portable version."
          prerelease: false
          make_latest: true
          files: |
            SystemCtrl.exe
            Output/SystemCtrl-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
