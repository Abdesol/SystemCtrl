name: Build and Release

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'installer.iss'
  workflow_dispatch:

jobs:
  build:
    name: Build SystemCtrl (Windows)
    runs-on: windows-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish SystemCtrl
        run: dotnet publish "src\SystemCtrl.Desktop\SystemCtrl.Desktop.csproj" -c Release -r win-x64

      - name: Prepare Artifact
        run: |
          Copy-Item "src\SystemCtrl.Desktop\bin\Release\net10.0-windows\win-x64\publish\SystemCtrl.exe" "SystemCtrl.exe"

      - name: Build Installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "latest"
          body: "This is the most recent automated build of SystemCtrl. Choose the Installer for a normal installation, or the standalone Executable for a portable version."
          prerelease: false
          make_latest: true
          files: |
            SystemCtrl.exe
            Output/SystemCtrl-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
